spring.application.name=servicehub
server.port=${SERVER_PORT:8080}

# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5455/servicehub}
spring.datasource.username=${DB_USER:servicehub}
spring.datasource.password=${DB_PASSWORD:servicehub}

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
# Override JWT_SECRET everywhere outside local development (min 32 bytes for HS256).
app.jwt.secret=${JWT_SECRET:dev-only-change-me-servicehub-jwt-secret-key-32b}
app.jwt.expiration=${JWT_EXPIRATION:15m}

# --- Registration ---
app.registration.enabled=${REGISTRATION_ENABLED:true}

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- OpenAPI / Swagger ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Intentional: AuthenticationProvider is defined manually in SecurityConfig
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
